<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="refresh" content="90">
<title>VIABLE — Mantenimiento programado</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#16233A; --ink-soft:#5A6B78; --paper:#EAEDEF; --white:#FFFFFF; --line:#DCE2E4; --steel:#1E6E8C;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light dark;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --ink:#E7EDF2; --ink-soft:#9FB0BE; --paper:#101820; --white:#17222B; --line:#2C3D46; --steel:#6FB4D0;
}}
:root[data-theme="dark"]{
  --ink:#E7EDF2; --ink-soft:#9FB0BE; --paper:#101820; --white:#17222B; --line:#2C3D46; --steel:#6FB4D0;
}
*{ box-sizing:border-box; }
html{ height:100%; }
body{
  height:100%; margin:0; display:flex; align-items:center; justify-content:center;
  background:var(--paper); color:var(--ink); font-family:'IBM Plex Sans',sans-serif;
  -webkit-font-smoothing:antialiased;
}
.tarjeta{
  max-width:420px; width:100%; margin:20px; padding:40px 34px;
  background:var(--white); border:1px solid var(--line); border-radius:14px;
  text-align:center; box-shadow:0 18px 46px rgba(15,25,40,.10);
}
.marca{
  font-family:'Fraunces',serif; font-weight:600; font-size:20px; letter-spacing:.02em;
  color:var(--ink); margin-bottom:26px;
}
.icono{
  width:54px; height:54px; margin:0 auto 20px; border-radius:50%;
  background:var(--steel); color:#fff; display:flex; align-items:center; justify-content:center;
  font-size:24px; animation:girar 2.2s linear infinite;
}
@keyframes girar{ to{ transform:rotate(360deg); } }
@media (prefers-reduced-motion: reduce){ .icono{ animation:none; } }
h1{ font-family:'Fraunces',serif; font-weight:600; font-size:22px; margin:0 0 10px; line-height:1.3; }
p{ font-size:14.5px; line-height:1.6; color:var(--ink-soft); margin:0 0 6px; }
.eta{ font-size:12.5px; color:var(--ink-soft); margin-top:22px; padding-top:18px; border-top:1px solid var(--line); }
</style>
</head>
<body>
  <div class="tarjeta">
    <div class="marca">VIABLE</div>
    <div class="icono" aria-hidden="true">⟳</div>
    <h1>Estamos haciendo un ajuste</h1>
    <p>El panel y la app de viabilidad vuelven enseguida.</p>
    <p>Tus estudios están a salvo — esto no borra ni cambia nada.</p>
    <div class="eta">Esta página se actualiza sola cada minuto y medio.</div>
  </div>
</body>
</html>
